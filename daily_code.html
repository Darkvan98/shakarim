<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Код дня — Shakarim Sport</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f5f7; display: grid; place-items: center; min-height: 100vh; margin: 0; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.08); padding: 32px 36px; width: 320px; text-align: center; }
  h1 { font-size: 17px; color: #324266; margin: 0 0 4px; }
  .muted { color: #8a93a5; font-size: 13px; margin: 0 0 18px; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1.5px solid #d7dce5; border-radius: 10px; font: inherit; margin-bottom: 12px; }
  .code { font-size: 44px; font-weight: 800; letter-spacing: .12em; color: #324266; margin: 10px 0 4px; }
  .date { color: #8a93a5; font-size: 13px; }
  small { color: #8a93a5; font-size: 11.5px; display: block; margin-top: 16px; line-height: 1.5; }
</style>
</head>
<body>
<div class="card">
  <h1>Код дня админ-панели</h1>
  <p class="muted">Вводи секрет (ADMIN_DAILY_SECRET) и дату</p>
  <input id="secret" placeholder="Секрет (ADMIN_DAILY_SECRET)" />
  <input id="date" type="date" />
  <div class="code" id="code">——————</div>
  <div class="date" id="dateLabel"></div>
  <small>Считает офлайн, прямо в браузере. Код действует с 00:00 до 23:59 по указанной дате.</small>
</div>
<script>
  async function sha256Hex(msg) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  async function hmacHex(secret, msg) {
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    const sig = await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(msg));
    return Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  async function update() {
    const secret = document.getElementById('secret').value || 'shakarim-daily-secret';
    const d = document.getElementById('date').value || new Date().toISOString().slice(0, 10);
    const hex = await hmacHex(secret, d);
    const digits = (hex.match(/\d/g) || []).join('');
    document.getElementById('code').textContent = (digits + '000000').slice(0, 6);
    document.getElementById('dateLabel').textContent = new Date(d + 'T00:00:00').toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }
  document.getElementById('secret').addEventListener('input', update);
  document.getElementById('date').addEventListener('input', update);
  document.getElementById('date').value = new Date().toISOString().slice(0, 10);
  update();
</script>
</body>
</html>
